<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tank Viewer</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="panel">
    <h1>Tank Viewer</h1>

    <label>Hull</label>
    <select id="hull"></select>
    <label>Hull mod</label>
    <select id="hullMod"></select>

    <label>Turret</label>
    <select id="turret"></select>
    <label>Turret mod</label>
    <select id="turretMod"></select>

    <label>Paint</label>
    <select id="paint"></select>

    <p id="status"></p>
  </div>

  <div id="view"></div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
