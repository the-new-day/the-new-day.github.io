<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTanki Wiki — Codegen</title>

    <link rel="stylesheet" type="text/css" href="style.css"> 
</head>
<body>
    <div class="container">
        <h1 class="main-header">
            ProTanki Wiki<br>Codegen
        </h1>
        <div class="forms">
            <div class="textarea-container">
                <textarea name="input" id="inputCode" placeholder="Paste EN code here..."></textarea>
            </div>
            <div class="textarea-container">
                <textarea id="outputCode" readonly placeholder="Result here..."></textarea>
                <button class="textarea-copy" id="copyBtn" data-for="outputCode" type="button">
                Copy
                </button>
            </div>
        </div>
    </div>
    
    <script type="text/javascript" src="script.js"></script>
</body>
</html>
